# /etc/apache2/sites-available/www.grupo0.bsi-26-2.maceio.lab.conf — versão com HTTPS e StartTLS (Aula 12)
# Troque grupo0 pelo seu grupo. Requer a CA do grupo e os arquivos www.grupo0.crt e www.grupo0.key (Aula 12).
# Ativar:  sudo a2enmod ssl ldap authnz_ldap headers
#          sudo a2ensite www.grupo0.bsi-26-2.maceio.lab && sudo a2dissite 000-default
#          sudo apache2ctl configtest && sudo systemctl reload apache2

# O Apache confia na CA do grupo para o StartTLS com o LDAP.
LDAPTrustedGlobalCert CA_BASE64 /usr/local/share/ca-certificates/ca-grupo0.crt

# HTTP: só redireciona para HTTPS.
<VirtualHost *:80>
    ServerName www.grupo0.bsi-26-2.maceio.lab
    ServerAlias www
    Redirect permanent / https://www.grupo0.bsi-26-2.maceio.lab/
</VirtualHost>

<VirtualHost *:443>
    ServerName  www.grupo0.bsi-26-2.maceio.lab
    ServerAlias www
    ServerAdmin webmaster@grupo0.bsi-26-2.maceio.lab

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/www.grupo0.crt
    SSLCertificateKeyFile /etc/ssl/private/www.grupo0.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    Header always set Strict-Transport-Security "max-age=31536000"

    DocumentRoot /var/www/www.grupo0.bsi-26-2.maceio.lab/public
    <Directory /var/www/www.grupo0.bsi-26-2.maceio.lab/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Location /admin>
        AuthType Basic
        AuthName "Administração do site - Grupo 0 (login do LDAP)"
        AuthBasicProvider ldap
        AuthLDAPURL "ldap://ldap.grupo0.bsi-26-2.maceio.lab/ou=usuarios,dc=grupo0,dc=bsi-26-2,dc=maceio,dc=lab?uid?one" STARTTLS
        AuthLDAPGroupAttribute memberUid
        AuthLDAPGroupAttributeIsDN off
        Require ldap-group cn=lsor-g0,ou=grupos,dc=grupo0,dc=bsi-26-2,dc=maceio,dc=lab
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/www.grupo0-error.log
    CustomLog ${APACHE_LOG_DIR}/www.grupo0-access.log combined
</VirtualHost>
